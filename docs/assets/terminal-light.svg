<text x="20" y="674" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,Liberation Mono,monospace" font-size="13.5" xml:space="preserve"><tspan fill="#cf222e">limit</tspan><tspan fill="#6e7781">:</tspan><tspan fill="#1f2328"> VoltageLevel 20 V is above the limit of 12 V</tspan></text>
<text x="20" y="718" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,Liberation Mono,monospace" font-size="13.5" xml:space="preserve"><tspan fill="#bf3989">$ </tspan><tspan fill="#1f2328" font-weight="600">labrat stop</tspan></text>
