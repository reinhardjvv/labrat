<text x="20" y="608" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,Liberation Mono,monospace" font-size="13.5" xml:space="preserve"><tspan fill="#1f2328">  </tspan><tspan fill="#6e7781">safe state  </tspan><tspan fill="#1f2328">OutputEnabled </tspan><tspan fill="#6e7781">off</tspan></text>
