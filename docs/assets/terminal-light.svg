<text x="20" y="344" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,Liberation Mono,monospace" font-size="13.5" xml:space="preserve"><tspan fill="#1f2328">  </tspan><tspan fill="#1f2328" font-weight="600">VoltageLevel</tspan><tspan fill="#1f2328">    2    </tspan><tspan fill="#0550ae" font-weight="600">0</tspan><tspan fill="#1f2328"> </tspan><tspan fill="#6e7781">V</tspan><tspan fill="#1f2328">     0 .. 12 V   read/write</tspan></text>
