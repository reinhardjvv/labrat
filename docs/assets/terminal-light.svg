<text x="20" y="542" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,Liberation Mono,monospace" font-size="13.5" xml:space="preserve"><tspan fill="#1f2328">  </tspan><tspan fill="#6e7781">STREAM</tspan><tspan fill="#1f2328">     </tspan><tspan fill="#6e7781">CONTENT</tspan><tspan fill="#1f2328">                </tspan></text>
