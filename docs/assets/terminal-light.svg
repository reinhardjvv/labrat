<text x="20" y="476" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,Liberation Mono,monospace" font-size="13.5" xml:space="preserve"><tspan fill="#1f2328">  </tspan><tspan fill="#6e7781">FUNCTION</tspan><tspan fill="#1f2328">   </tspan><tspan fill="#6e7781">ARGUMENTS</tspan><tspan fill="#1f2328">   </tspan></text>
