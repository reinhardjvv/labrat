<text x="20" y="674" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,Liberation Mono,monospace" font-size="13.5" xml:space="preserve"><tspan fill="#ff7b72">limit</tspan><tspan fill="#7d8590">:</tspan><tspan fill="#e6edf3"> VoltageLevel 20 V is above the limit of 12 V</tspan></text>
