name: Automated review

# An AI review of every pull request, as advice for the maintainers. It reads the diff against the rules in
# AGENTS.md and CONTRIBUTING.md. It runs only when the repository has the ANTHROPIC_API_KEY secret, and never
# for pull requests from forks, which cannot see secrets.

on:
  pull_request:
    types: [opened, synchronize, ready_for_review]

permissions:
  contents: read
  pull-requests: write
  id-token: write

jobs:
  review:
    if: github.event.pull_request.head.repo.full_name == github.repository && !github.event.pull_request.draft
    runs-on: ubuntu-latest
    steps:
      - name: Check for the API key
        id: key
        run: echo "present=${{ secrets.ANTHROPIC_API_KEY != '' }}" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        if: steps.key.outputs.present == 'true'
        with:
          fetch-depth: 0
      - uses: anthropics/claude-code-action@v1
        if: steps.key.outputs.present == 'true'
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_args: >-
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
          prompt: |
            Review this pull request to LABRAT, software that controls real laboratory equipment.
            Read AGENTS.md and CONTRIBUTING.md first and hold the change to them. In order of importance:
            1. Safety: anything that loosens a limit, skips a check, weakens a safe state, a lock or a role.
            2. Correctness bugs, with the input that triggers them.
            3. Private data: real IP addresses, host names, user names, paths, tokens or keys.
            4. Missing tests that would run without hardware.
            5. Wording in docs: plain, factual, UK spelling, no promotional language.
            Comment on specific lines. Say nothing about style the linters already check. If the change is
            sound, say so in one sentence.
